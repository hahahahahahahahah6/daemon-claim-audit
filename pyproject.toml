[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daemon-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented detachment promises"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
daemon-claim-audit = "daemon_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["daemon_claim_audit*"]
